# .github/workflows/scorecard.yml: runs OpenSSF Scorecard and uploads SARIF.
# Replace <sha> placeholders with real pinned SHAs (see the ossf/scorecard-action README).
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # publish results (OIDC)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@<sha> # v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@<sha> # v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@<sha> # v3
        with: { sarif_file: results.sarif }
