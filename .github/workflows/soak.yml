name: soak-test

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Soak duration in seconds (default 1800 = 30 minutes; below that the run is not a soak)"
        required: false
        default: "1800"
  schedule:
    # Weekly, Sunday 02:00 UTC
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned action, pinned version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Load test over real HTTP (uvicorn subprocess + httpx)
        run: uv run python scripts/run_load_test.py --requests 2000 --concurrency 10 --out-dir results
      - name: Soak test over real HTTP (30 minutes by default)
        run: uv run python scripts/run_soak_test.py --duration "${{ github.event.inputs.duration_seconds || '1800' }}" --out-dir results
      - name: Upload load and soak results (the committed copies are produced by the same scripts)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-and-soak-results
          path: results/
