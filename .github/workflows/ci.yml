name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims-and-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned action, pinned version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Verify claims policy
        run: uv run python scripts/check_claims.py
      - name: Verify evidence register and citations
        run: uv run python scripts/check_evidence.py
      - name: Verify evidence excerpts audit
        run: uv run python scripts/audit_excerpts.py
      - name: Verify reality audit and anti-fabrication policy
        run: uv run python scripts/reality_audit.py --require-stub-registry
      - name: Verify i18n review-state and glossary
        run: uv run python scripts/check_i18n_review_state.py
      - name: Verify Hazard Log and safety controls
        run: uv run python scripts/verify_hazard_log.py
      - name: Verify docs/STATUS.md is fresh
        run: uv run python scripts/generate_status.py --check

  # G-08 / G-10: MkDocs build, link check, README↔lockfile version claims (fail-then-pass seeds).
  docs-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install workspace + docs group
        run: uv sync --all-packages --group docs
      - name: Seed-fail README version claims (must exit non-zero)
        run: |
          if uv run python scripts/check_readme_version_claims.py --seed-fail; then
            echo "::error::readme version --seed-fail unexpectedly passed"; exit 1
          fi
      - name: Seed-fail licence inventory (must exit non-zero)
        run: |
          if uv run python scripts/generate_licence_inventory.py --seed-fail; then
            echo "::error::licence inventory --seed-fail unexpectedly passed"; exit 1
          fi
      - name: README version claims
        run: uv run python scripts/check_readme_version_claims.py
      - name: Licence inventory + NOTICE
        run: uv run python scripts/generate_licence_inventory.py
      - name: MkDocs Material build
        run: uv run --group docs mkdocs build --config-file mkdocs.yml
      - name: Docs link check
        run: python3 scripts/check_docs_links.py

  clean-clone-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned action, pinned version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Hermetic clean-clone study reproducibility
        run: |
          set -euo pipefail
          CLEAN=$(mktemp -d)
          # Fresh tree without the runner's workspace caches or local edits
          git clone --no-local "file://${GITHUB_WORKSPACE}" "${CLEAN}/vigil"
          cd "${CLEAN}/vigil"
          git checkout "${GITHUB_SHA}"
          uv sync --all-packages
          # The reproduce gate must be able to fail: the seeded run has to exit non-zero.
          if uv run python scripts/reproduce.py --seed-fail >/dev/null 2>&1; then
            echo "::error::reproduce --seed-fail unexpectedly passed"; exit 1
          fi
          # make reproduce = study regeneration + bit-diff (verify_study_reproducibility.py), STATUS freshness,
          # SBOM regeneration diff, release manifest verify. Absorbed the former reproduce-smoke job.
          make reproduce
          echo "Clean-clone reproducibility OK at ${GITHUB_SHA}"

  # Backend CI is split into parallel jobs (wall time = slowest, not the sum). Nothing was dropped:
  # `backend-tests` shards cover the same `uv run pytest` selection, `backend-acceptance` runs the same
  # phase-gated acceptance steps with their own env vars, and the aggregate job below keeps the
  # required-check name `backend-lint-and-test` stable.
  backend-tests:
    name: backend-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [ml, clinical, resilience, misc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned action, pinned version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Install Tesseract (local OCR for lab-report images)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Run linting
        if: matrix.shard == 'misc'
        run: uv run ruff check .
      - name: Run tests (pytest-randomly shuffles order; seed printed in header)
        # G-07: pytest-randomly is a committed dev dependency and auto-loads.
        run: |
          # NB: --ignore silently does nothing for dirs in testpaths; --ignore-glob works (verified by count).
          # The four shards partition the original `uv run pytest` selection exactly (misc = the remainder).
          case "${{ matrix.shard }}" in
            ml)         uv run pytest packages/vigil-ml/tests ;;
            clinical)   uv run pytest tests/clinical ;;
            resilience) uv run pytest tests/resilience ;;
            misc)       uv run pytest --ignore-glob='packages/vigil-ml/tests/*' --ignore-glob='tests/clinical/*' --ignore-glob='tests/resilience/*' ;;
          esac

  backend-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned action, pinned version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Install Tesseract (local OCR for lab-report images)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Run K1 acceptance contract tests
        run: VIGIL_ACCEPTANCE=1 VIGIL_CONTRACT_V2=1 uv run pytest tests/acceptance_k1 -v
      - name: Run Phase 3B acceptance contract tests
        run: VIGIL_ACCEPT_3B=1 uv run pytest tests/acceptance_3b -v
      - name: Run Phase 4a acceptance contract tests
        run: VIGIL_ACCEPT_P4=1 VIGIL_CONTRACT_P4V2=1 uv run pytest tests/acceptance_p4 -v
      - name: Run Phase 5 acceptance contract tests
        run: VIGIL_ACCEPT_P5=1 uv run pytest tests/acceptance_p5 -v
      - name: Run Phase 7 acceptance contract tests
        run: VIGIL_ACCEPT_P7=1 uv run pytest tests/acceptance_p7 -v
      - name: Run Phase 8 acceptance contract tests
        run: VIGIL_ACCEPT_P8=1 uv run pytest tests/acceptance_p8 -v
      - name: Run Phase 9 acceptance contract tests
        run: VIGIL_ACCEPT_P9=1 uv run pytest tests/acceptance_p9 -v
      - name: Run Phase 11 acceptance contract tests
        run: VIGIL_ACCEPT_P11=1 uv run pytest tests/acceptance_p11 -v
      - name: Run Phase 12 acceptance contract tests
        run: VIGIL_ACCEPT_P12=1 uv run pytest tests/acceptance_p12 -v
      - name: Run Phase 13 acceptance contract tests
        run: VIGIL_ACCEPT_P13=1 uv run pytest tests/acceptance_p13 -v
      - name: Run Phase 14 acceptance contract tests
        run: VIGIL_ACCEPT_P14=1 uv run pytest tests/acceptance_p14 -v
      - name: Run Phase 15 acceptance contract tests
        run: VIGIL_ACCEPT_P15=1 uv run pytest tests/acceptance_p15 -v

  backend-lint-and-test:
    needs: [backend-tests, backend-acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All backend jobs must have succeeded
        run: |
          echo "tests=${{ needs.backend-tests.result }} acceptance=${{ needs.backend-acceptance.result }}"
          [ "${{ needs.backend-tests.result }}" = "success" ] && [ "${{ needs.backend-acceptance.result }}" = "success" ]

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install monorepo dependencies
        run: npm ci
      - name: Lint web application
        run: npm run web:lint
      - name: Build web application
        run: npm run web:build

  e2e-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned action, pinned version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install Python dependencies
        run: uv sync --all-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install monorepo dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build web application
        run: npm run web:build
      - name: Run Playwright E2E integration tests (Workstation & Companion)
        run: npm --workspace=@vigil/web run test:e2e
      - name: Enforce Lighthouse performance and accessibility budgets
        run: node scripts/run_lighthouse.mjs

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional Commits (BASE..HEAD)
        run: python3 scripts/check_commit_messages.py "origin/${{ github.base_ref }}"

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pinned action, pinned version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Export locked Python dependencies
        run: uv export --frozen --all-packages --no-hashes --no-emit-workspace > requirements.audit.txt
      - name: pip-audit (known vulnerabilities in locked Python dependencies)
        run: uvx pip-audit==2.10.1 -r requirements.audit.txt --no-deps --disable-pip
      - name: npm audit (production dependencies of the web tier; high/critical block)
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Repo-standards audit (critical findings only; full gap list is in docs/audits)
        run: python3 scripts/audit_repo_standards.py --critical-only
