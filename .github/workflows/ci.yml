name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims-and-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify claims policy
        run: python3 scripts/check_claims.py
      - name: Verify evidence register and citations
        run: python3 scripts/check_evidence.py
      - name: Verify evidence excerpts audit
        run: python3 scripts/audit_excerpts.py
      - name: Verify reality audit and anti-fabrication policy
        run: python3 scripts/reality_audit.py --require-stub-registry

  backend-lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run linting
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest
      - name: Run K1 acceptance contract tests
        run: VIGIL_ACCEPTANCE=1 VIGIL_CONTRACT_V2=1 uv run pytest tests/acceptance_k1 -v
      - name: Run Phase 3B acceptance contract tests
        run: VIGIL_ACCEPT_3B=1 uv run pytest tests/acceptance_3b -v
      - name: Run Phase 4a acceptance contract tests
        run: VIGIL_ACCEPT_P4=1 VIGIL_CONTRACT_P4V2=1 uv run pytest tests/acceptance_p4 -v
      - name: Run Phase 5 acceptance contract tests
        run: VIGIL_ACCEPT_P5=1 uv run pytest tests/acceptance_p5 -v
      - name: Run Phase 7 acceptance contract tests
        run: VIGIL_ACCEPT_P7=1 uv run pytest tests/acceptance_p7 -v
      - name: Run Phase 8 acceptance contract tests
        run: VIGIL_ACCEPT_P8=1 uv run pytest tests/acceptance_p8 -v
      - name: Run Phase 9 acceptance contract tests
        run: VIGIL_ACCEPT_P9=1 uv run pytest tests/acceptance_p9 -v


  frontend-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install monorepo dependencies
        run: npm ci
      - name: Lint web application
        run: npm run web:lint
      - name: Build web application
        run: npm run web:build
