# G-10: tag-triggered release artefacts (SBOM, provenance, hash manifest; cosign if key present).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build as (dispatch only; does not create the git tag)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          uv sync --all-packages
          npm ci

      - name: Resolve release id
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SBOMs
        run: uv run python scripts/generate_sbom.py

      - name: Licence inventory + NOTICE
        run: uv run python scripts/generate_licence_inventory.py

      - name: Hash manifest (working tree after SBOM/NOTICE regen)
        run: |
          uv run python scripts/generate_release_manifest.py generate \
            --release "${{ steps.rel.outputs.id }}" \
            --from-workdir

      - name: Verify hash manifest against working tree
        run: uv run python scripts/generate_release_manifest.py verify --release "${{ steps.rel.outputs.id }}"

      - name: Upload release artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vigil-release-${{ steps.rel.outputs.id }}
          path: |
            reports/sbom/
            reports/quality/LICENCE_INVENTORY.json
            NOTICE
            docs/release/RELEASE_MANIFEST_*.json

      - name: Attest build provenance (SBOM + manifest)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            reports/sbom/sbom-python.cdx.json
            reports/sbom/sbom-npm.cdx.json

      - name: Cosign (only when owner key secret exists)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "COSIGN_PRIVATE_KEY not set — skipping sign (owner action H-209 / SIGNING.md)"
            exit 0
          fi
          curl -sL "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64" -o /tmp/cosign
          chmod +x /tmp/cosign
          echo "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
          uv run python scripts/generate_release_manifest.py sign \
            --key /tmp/cosign.key \
            --release "${{ steps.rel.outputs.id }}"
          rm -f /tmp/cosign.key
