name: quality-gates

# G-05, G-06, G-07 (partial), G-11 smoke — gates that must be able to fail.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typing-and-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Seeded failure — mypy on deliberately bad snippet
        run: |
          set +e
          cat > /tmp/vigil_mypy_seed.py <<'PY'
          def f(x: int) -> str:
              return x  # type error under --strict
          PY
          uv run mypy --strict /tmp/vigil_mypy_seed.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected mypy to fail on seed snippet" >&2
            exit 1
          fi
          echo "Seeded mypy failure OK (exit $code)"
      - name: mypy --strict (ADR-0030 scope)
        run: uv run mypy --config-file pyproject.toml
      - name: Seeded failure — import-linter broken contract
        run: |
          set +e
          # Temporarily plant a forbidden import; restore after.
          seed="packages/vigil-core/vigil_core/_import_linter_seed.py"
          printf 'from vigil_api import main  # noqa: F401\n' > "$seed"
          bash scripts/run_lint_imports.sh
          code=$?
          rm -f "$seed"
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected lint-imports to fail on seeded vigil_api import" >&2
            exit 1
          fi
          echo "Seeded import-linter failure OK (exit $code)"
      - name: import-linter contracts
        run: bash scripts/run_lint_imports.sh

  coverage-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Seeded failure — coverage ratchet
        run: |
          set +e
          uv run python scripts/check_coverage_ratchet.py --seed-fail
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected coverage ratchet seed-fail" >&2
            exit 1
          fi
          echo "Seeded coverage failure OK"
      - name: Measure coverage (core + eval)
        run: |
          mkdir -p reports/quality
          uv run pytest packages/vigil-core/tests packages/vigil-eval/tests \
            --cov=vigil_core --cov=vigil_eval \
            --cov-report=json:reports/quality/coverage-run.json \
            --cov-report=term-missing:skip-covered \
            -q
      - name: Coverage ratchet vs floor
        run: uv run python scripts/check_coverage_ratchet.py --coverage-json reports/quality/coverage-run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-run-json
          path: reports/quality/coverage-run.json

  security-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks detect (working tree + history; allowlist in .gitleaks.toml)
        run: gitleaks detect --source . --verbose --redact --no-banner --config .gitleaks.toml
      - name: Bandit (API + core + eval)
        run: |
          mkdir -p reports/quality
          uv run bandit -r apps/api/vigil_api packages/vigil-core/vigil_core packages/vigil-eval/vigil_eval \
            -ll -f json -o reports/quality/bandit.json
          uv run bandit -r apps/api/vigil_api packages/vigil-core/vigil_core packages/vigil-eval/vigil_eval -ll
      - name: Semgrep (p/python)
        run: |
          # Avoid `uv run` (it re-syncs the lockfile and restores setuptools≥82, which
          # dropped pkg_resources needed by semgrep's otel instrumentation).
          # Official image is hermetic and SHA-pinned via digest when practical; tag is OK here.
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.110.0@sha256:a147965cd455dd773f639b09c53b1428aa2d24f1c3459ca203a8ce84845e8f18 \
            semgrep scan --config p/python --error --metrics=off \
            --exclude='quarantine/**' --exclude='reports/**' --exclude='**/.venv/**' \
            apps/api packages/vigil-core packages/vigil-eval packages/vigil-ml
      - name: Trivy filesystem
        run: |
          # Docker image avoids aquasecurity/trivy-action's flaky GitHub install script.
          docker run --rm -v "$PWD:/src" -w /src \
            aquasec/trivy:0.65.0 \
            fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            --skip-dirs .venv --skip-dirs node_modules --skip-dirs .git \
            --skip-dirs trivy \
            .

      - name: Seeded failures — every scanner must reject a planted violation
        run: |
          # A gate that cannot fail is theatre. Each scanner is run, with the same invocation as above,
          # on a temp dir containing one deliberate violation, and must exit non-zero.
          S="$RUNNER_TEMP/seed"; mkdir -p "$S/py" "$S/dep"
          printf 'import hashlib, subprocess\ndef f(x):\n    subprocess.call(x, shell=True)\n    return hashlib.md5(x).hexdigest()\n' > "$S/py/bad.py"
          printf 'TOKEN = "ghp_R8x2KqLm9ZtV4nB7cYw3Hd6Jf1Sa5PeU0gQo"\n' > "$S/py/leak.py"
          printf 'django==2.0\n' > "$S/dep/requirements.txt"
          expect_fail() { name="$1"; shift; if "$@" >/dev/null 2>&1; then echo "::error::$name did not fail on a seeded violation"; exit 1; fi; echo "seeded $name failure OK"; }
          expect_fail gitleaks gitleaks detect --source "$S/py" --no-git --no-banner --redact --config .gitleaks.toml
          expect_fail bandit uv run bandit -r "$S/py" -ll
          expect_fail semgrep docker run --rm -v "$S:/src" -w /src semgrep/semgrep:1.110.0@sha256:a147965cd455dd773f639b09c53b1428aa2d24f1c3459ca203a8ce84845e8f18 semgrep scan --config p/python --error --metrics=off py
          expect_fail trivy docker run --rm -v "$S:/src" -w /src aquasec/trivy:0.65.0 fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed dep

      - name: Licence allowlist
        run: uv run python scripts/check_licences.py
      - name: Seeded failure — licence gate
        run: |
          set +e
          uv run python scripts/check_licences.py --seed-fail
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected licence seed-fail" >&2
            exit 1
          fi
          echo "Seeded licence failure OK"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency review (requires Dependency graph / GHAS on private repos)
        id: dep_review
        continue-on-error: true
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
      - name: Record outcome (owner-gated feature must not silently block)
        run: |
          set -euo pipefail
          mkdir -p reports/quality
          outcome="${{ steps.dep_review.outcome }}"
          echo "{\"outcome\":\"${outcome}\",\"note\":\"Enable Dependency graph (+ GHAS if private) per docs/ops/GITHUB-SETTINGS.md. pip-audit/npm audit remain hard gates in ci.yml.\"}" \
            > reports/quality/DEPENDENCY_REVIEW.json
          cat reports/quality/DEPENDENCY_REVIEW.json
          if [ "$outcome" = "success" ]; then
            echo "dependency-review passed"
            exit 0
          fi
          # Unsupported on this repo until the owner enables Dependency graph (H-305).
          echo "dependency-review not available or failed — recorded as PARTIAL; see GITHUB-SETTINGS.md H-305"
          exit 0

  reproduce-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Seeded failure — make reproduce
        run: |
          set +e
          uv run python scripts/reproduce.py --seed-fail
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected reproduce seed-fail" >&2
            exit 1
          fi
          echo "Seeded reproduce failure OK"
      - name: make reproduce (smoke)
        run: make reproduce
