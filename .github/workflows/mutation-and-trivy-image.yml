name: mutation-and-trivy-image

# G-06 mutation (nightly) + G-07 Trivy image scan after docker build.
on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-trivy
  cancel-in-progress: true

jobs:
  mutation-m5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies + mutmut
        run: |
          uv sync --all-packages
          uv pip install mutmut==3.3.1
      - name: Mutation score on vigil_ml.m5
        run: uv run python scripts/run_mutation_m5.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-score
          path: reports/quality/MUTATION_SCORE.json

  trivy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -f infra/Dockerfile.api -t vigil-api:ci .
      - name: Trivy image (API)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 \
            image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            vigil-api:ci
