[project]
name = "vigil-api"
version = "0.1.0-alpha"
description = "Vigil Precision Oncology Decision Support API"
readme = "README.md"
authors = [
    { name = "Gideon Sanni", email = "gideonsanni2023@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "vigil-core",
    "vigil-ml",
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.2.0",
    "uvicorn>=0.30.0",
    "xgboost>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
