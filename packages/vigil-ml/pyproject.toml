[project]
name = "vigil-ml"
version = "0.1.0-alpha"
description = "Vigil Causal Modeling, Feature Pipelines, and Inference Runtime"
authors = [{ name = "Gideon Sanni", email = "gideonsanni2023@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "vigil-core",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "xgboost>=2.0.0",
    "safetensors>=0.8.0",
    "torch>=2.0.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "jax>=0.4.0",
    "numpyro>=0.15.0",
    "ortools>=9.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vigil_ml"]

[tool.hatch.build.targets.wheel.force-include]
"vigil_ml/models/m3_assumptions_v1.json" = "vigil_ml/models/m3_assumptions_v1.json"
"vigil_ml/models/k2_research_config_v1.json" = "vigil_ml/models/k2_research_config_v1.json"

