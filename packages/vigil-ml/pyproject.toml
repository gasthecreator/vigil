[project]
name = "vigil-ml"
version = "0.1.0-alpha"
description = "Vigil Causal Modeling, Feature Pipelines, and Inference Runtime"
authors = [{ name = "Gideon Sanni", email = "gideonsanni2023@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "vigil-core",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "xgboost>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vigil_ml"]

