[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gideon Sanni", email = "gideonsanni2023@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
sentinel-backend = "sentinel_backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
