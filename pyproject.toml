[project]
name = "vigil-workspace"
version = "0.1.0-alpha"
description = "Vigil Precision Oncology Decision Support Platform Workspace"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "numpyro>=0.22.0",
    "jax>=0.10.2",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/vigil-core",
    "packages/vigil-sim",
    "packages/vigil-eval",
    "packages/vigil-ml",
    "packages/contracts",
]

[tool.uv.sources]
vigil-core = { workspace = true }
vigil-sim = { workspace = true }
vigil-eval = { workspace = true }
vigil-ml = { workspace = true }
vigil-contracts = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/vigil-core/tests",
    "packages/vigil-sim/tests",
    "packages/vigil-eval/tests",
    "packages/vigil-ml/tests",
    "packages/contracts/tests",
    "tests",
]
python_files = ["test_*.py"]
pythonpath = [
    "apps/api",
    "packages/vigil-core",
    "packages/vigil-sim",
    "packages/vigil-eval",
    "packages/vigil-ml",
    "packages/contracts",
]
markers = [
    "postgres: requires Postgres (VIGIL_POSTGRES_TEST_URL)",
    "sqlite_only: exercises SQLite-specific mechanisms; skipped on Postgres CI",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "types-pyyaml>=6.0.12.20260906",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

# G-05: strict typing on the packages named in PROMPT-P16 PR2 (see ADR-0030).
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = [
    "packages/vigil-core/vigil_core",
    "packages/vigil-eval/vigil_eval",
    "packages/vigil-ml/vigil_ml/m5.py",
    "packages/vigil-ml/vigil_ml/k6.py",
]
mypy_path = ["packages/vigil-core", "packages/vigil-eval", "packages/vigil-ml"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "sklearn"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# G-05: hexagonal-ish layering — domain packages must not import the API app.
[tool.importlinter]
root_packages = ["vigil_core", "vigil_eval", "vigil_ml", "vigil_sim", "contracts", "vigil_api"]

[[tool.importlinter.contracts]]
name = "Domain packages do not import the API"
type = "forbidden"
source_modules = ["vigil_core", "vigil_eval", "vigil_ml", "vigil_sim", "contracts"]
forbidden_modules = ["vigil_api"]

[[tool.importlinter.contracts]]
name = "vigil-core has no ML/eval/sim imports"
type = "forbidden"
source_modules = ["vigil_core"]
forbidden_modules = ["vigil_ml", "vigil_eval", "vigil_sim"]
