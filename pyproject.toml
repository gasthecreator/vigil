[project]
name = "vigil-workspace"
version = "0.1.0-alpha"
description = "Vigil Precision Oncology Decision Support Platform Workspace"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "numpyro>=0.22.0",
    "jax>=0.10.2",
    "sbi>=0.27.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/vigil-core",
    "packages/vigil-sim",
    "packages/vigil-eval",
    "packages/vigil-ml",
    "packages/contracts",
]

[tool.uv.sources]
vigil-core = { workspace = true }
vigil-sim = { workspace = true }
vigil-eval = { workspace = true }
vigil-ml = { workspace = true }
vigil-contracts = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/vigil-core/tests",
    "packages/vigil-sim/tests",
    "packages/vigil-eval/tests",
    "packages/vigil-ml/tests",
    "packages/contracts/tests",
    "tests",
]
python_files = ["test_*.py"]
pythonpath = [
    "apps/api",
    "packages/vigil-core",
    "packages/vigil-sim",
    "packages/vigil-eval",
    "packages/vigil-ml",
    "packages/contracts",
]
markers = [
    "postgres: requires Postgres (VIGIL_POSTGRES_TEST_URL)",
    "sqlite_only: exercises SQLite-specific mechanisms; skipped on Postgres CI",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
